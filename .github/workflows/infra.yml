name: Infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/infra.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  TOFU_VERSION: "1.10.6"
  TOFU_ZIP_SHA256: "15b7bed76420b50da3e121769c43341df8cd57d751ca14e6dbe9c850124c6dac"

jobs:
  opentofu-and-shell:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fail closed if DOPPLER_TOKEN reads bootstrap-admin
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: scripts/test/doppler-ci-runtime-guard.sh

      - name: Install OpenTofu
        run: |
          TOFU_ZIP="tofu_${TOFU_VERSION}_linux_amd64.zip"
          BASE_URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}"
          curl -fsSL -o /tmp/tofu.zip "${BASE_URL}/${TOFU_ZIP}"
          curl -fsSL -o /tmp/tofu.sha256sums "${BASE_URL}/tofu_${TOFU_VERSION}_SHA256SUMS"
          EXPECTED="$(grep "${TOFU_ZIP}" /tmp/tofu.sha256sums | awk '{print $1}')"
          ACTUAL="$(sha256sum /tmp/tofu.zip | awk '{print $1}')"
          if [[ "${EXPECTED}" != "${TOFU_ZIP_SHA256}" || "${EXPECTED}" != "${ACTUAL}" ]]; then
            echo "OpenTofu zip SHA256 mismatch for ${TOFU_ZIP}" >&2
            echo "expected (pinned): ${TOFU_ZIP_SHA256}" >&2
            echo "expected (sums file): ${EXPECTED}" >&2
            echo "actual:   ${ACTUAL}" >&2
            exit 1
          fi
          unzip -p /tmp/tofu.zip tofu | sudo tee /usr/local/bin/tofu >/dev/null
          sudo chmod +x /usr/local/bin/tofu
          tofu version

      - name: OpenTofu fmt check
        run: tofu fmt -check -recursive infra/opentofu

      - name: OpenTofu validate and test (state-bootstrap)
        env:
          TF_VAR_bootstrap_state_encryption_passphrase: mock-bootstrap-passphrase-16
          TF_VAR_bootstrap_state_encryption_passphrase_legacy: mock-bootstrap-passphrase-16
          TF_VAR_cloudflare_account_id: "00000000000000000000000000000001"
        working-directory: infra/opentofu/state-bootstrap
        run: |
          tofu init -backend=false
          tofu validate
          tofu test

      - name: OpenTofu validate and test (release-environment)
        env:
          TF_VAR_state_encryption_passphrase: mock-release-passphrase-16
          TF_VAR_state_encryption_passphrase_legacy: mock-release-passphrase-16
        working-directory: infra/opentofu/release-environment
        run: |
          tofu init -backend=false
          tofu validate
          tofu test

      - name: Plan file encryption test
        run: scripts/test/plan-encryption-test.sh

      - name: Cloudflare preflight negative test
        run: scripts/test/cloudflare-preflight-test.sh

      - name: Bootstrap backend restore test
        run: scripts/test/bootstrap-backend-restore-test.sh

      - name: Cloudflare account token preflight test
        run: scripts/test/cloudflare-preflight-account-token-test.sh

      - name: Cloudflare preflight mutation tests
        run: scripts/test/cloudflare-preflight-mutations-test.sh

      - name: Encryption rotation test
        run: scripts/test/encryption-rotation-test.sh

      - name: Doppler CI isolation test
        run: scripts/test/doppler-ci-isolation-test.sh

      - name: Bootstrap E2E clean checkout test
        run: scripts/test/bootstrap-e2e-clean-checkout-test.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/bootstrap-release-infra.sh \
            scripts/lib/doppler-secrets.sh \
            scripts/lib/preflight.sh \
            scripts/lib/plan-files.sh \
            scripts/lib/bootstrap-backend-mode.sh \
            scripts/lib/doppler-configs.sh \
            scripts/lib/doppler-ci-token.sh \
            scripts/lib/cloudflare-preflight-permissions.sh \
            scripts/lib/bootstrap-doppler-sync.sh \
            scripts/test/doppler-secrets-test.sh \
            scripts/test/doppler-ci-isolation-test.sh \
            scripts/test/doppler-ci-scope-test.sh \
            scripts/test/doppler-ci-runtime-guard.sh \
            scripts/test/encryption-rotation-test.sh \
            scripts/test/plan-encryption-test.sh \
            scripts/test/cloudflare-preflight-test.sh \
            scripts/test/cloudflare-preflight-account-token-test.sh \
            scripts/test/cloudflare-preflight-mutations-test.sh \
            scripts/test/bootstrap-e2e-clean-checkout-test.sh \
            scripts/test/bootstrap-backend-restore-test.sh

      - name: Doppler secrets helper test
        run: scripts/test/doppler-secrets-test.sh
